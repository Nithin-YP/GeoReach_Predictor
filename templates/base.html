<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GeoReach Predictor{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { width: 80%; margin: auto; overflow: hidden; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-top: 20px; }
        header { background: #333; color: #fff; padding: 10px 0; text-align: center; }
        header h1 { margin: 0; }
        nav ul { padding: 0; list-style: none; text-align: center; background: #eee; padding: 10px 0; }
        nav ul li { display: inline; padding: 0 15px; }
        nav ul li a { color: #333; text-decoration: none; }
        .messages { list-style: none; padding: 0; margin: 10px 0; }
        .messages li { padding: 10px; margin-bottom: 5px; border-radius: 5px; }
        .messages .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .messages .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .messages .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>
    <header>
        <h1>GeoReach Predictor</h1>
    </header>
    <nav>
        <ul>
            {% if user.is_authenticated %}
                <li>Hello, {{ user.username }}!</li>
                <li><a href="{% url 'core:logout' %}">Logout</a></li>
            {% else %}
                <li><a href="{% url 'core:login' %}">Login</a></li>
                <li><a href="{% url 'core:entrepreneur_register' %}">Register</a></li>
            {% endif %}
        </ul>
    </nav>
    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
