<!DOCTYPE html>
<html>
<head>
    <title>GIS Map Visualization</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; }
    </style>
</head>
<body>
    <h2>GIS Interactive Map</h2>
    <p><a href="/geo/dashboard/">Open SQL Dashboard</a></p>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([20.5937, 78.9629], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Cluster data from Django context
        var clusters = {{ clusters|safe }};
        clusters.forEach(function(cluster) {
            var color;
            if (cluster.level === "high") color = "green";
            else if (cluster.level === "medium") color = "yellow";
            else color = "red";

            var marker = L.circleMarker([cluster.lat, cluster.lng], {
                color: color,
                radius: 10,
                fillOpacity: 0.7
            }).addTo(map);

            marker.bindPopup(cluster.info);
        });
    </script>
</body>
</html>
