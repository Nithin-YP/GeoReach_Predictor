{% extends 'base.html' %}

{% block title %}Register as Entrepreneur{% endblock %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #1d2a35, #22303f);
        font-family: 'Poppins', sans-serif;
        color: #fff;
        min-height: 100vh;
    }

    .form-container {
        max-width: 500px;
        margin: 80px auto;
        padding: 40px 30px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        animation: fadeInUp 0.8s ease-in-out;
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 700;
        color: #00bcd4;
        text-shadow: 0 0 8px rgba(0,188,212,0.6);
    }

    form label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #e0f7fa;
    }

    form input, form select {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 20px;
        border-radius: 12px;
        border: 1px solid rgba(0,188,212,0.4);
        background: rgba(255,255,255,0.05);
        color: #fff;
        transition: all 0.3s ease;
    }

    form input:focus, form select:focus {
        outline: none;
        border-color: #00bcd4;
        box-shadow: 0 0 10px rgba(0,188,212,0.6);
        background: rgba(255,255,255,0.1);
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #00bcd4, #007bff);
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0,188,212,0.5);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0,188,212,0.7);
        background: linear-gradient(90deg, #007bff, #00bcd4);
    }

    .login-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #00bcd4;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .login-link:hover {
        text-shadow: 0 0 8px rgba(0,188,212,0.7);
    }

    @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
</style>

<div class="form-container">
    <h2>Register as Entrepreneur</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <a class="login-link" href="{% url 'core:login' %}">Already have an account? Login here</a>
</div>
{% endblock %}
